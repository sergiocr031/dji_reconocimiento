services:
  - type: web
    name: dji-reconocimiento-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: |
      pip install --upgrade pip
      pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1 torchvision==0.19.1
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
    healthCheckPath: /api/health
    autoDeploy: true